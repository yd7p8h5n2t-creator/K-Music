<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#08080a">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="K-Music"
    >

    <title>K-Music</title>

    <link rel="manifest" href="manifest.json">

    <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

        <div>
            <div class="eyebrow">TA MUSIQUE</div>
            <h1>K-Music</h1>
        </div>

        <button
            class="add-button"
            id="addMusic"
            aria-label="Ajouter de la musique"
        >
            +
        </button>

        <input
            type="file"
            id="musicInput"
            accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.alac"
            multiple
            hidden
        >

    </header>


    <!-- =========================
         CONTENU PRINCIPAL
    ========================== -->

    <main>

        <div class="search-box">

            <span>⌕</span>

            <input
                type="search"
                id="search"
                placeholder="Rechercher"
                autocomplete="off"
            >

        </div>


        <div class="section-header">

            <div>
                <span class="section-label">BIBLIOTHÈQUE</span>
                <h2>Mes morceaux</h2>
            </div>

            <span id="songCount" class="song-count">
                0 morceau
            </span>

        </div>


        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                Tous
            </button>

            <button
                class="filter"
                data-filter="favorites"
            >
                ♥ Favoris
            </button>

        </div>


        <section id="library" class="library">

            <div class="empty">

                <div class="empty-cover">
                    ♪
                </div>

                <h3>Ta bibliothèque est vide</h3>

                <p>
                    Ajoute tes morceaux pour commencer.
                </p>

                <button
                    class="primary-button"
                    id="addFirstMusic"
                >
                    Ajouter de la musique
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         MINI PLAYER
    ========================== -->

    <div
        class="mini-player hidden"
        id="miniPlayer"
    >

        <div
            class="mini-info"
            id="openPlayer"
        >

            <div
                class="mini-cover"
                id="miniCover"
            >
                ♪
            </div>

            <div class="mini-text">

                <strong id="miniTitle">
                    Aucun morceau
                </strong>

                <span id="miniArtist">
                    K-Music
                </span>

            </div>

        </div>


        <button
            class="mini-control"
            id="miniPrevious"
            aria-label="Précédent"
        >
            ⏮
        </button>


        <button
            class="mini-play"
            id="miniPlay"
            aria-label="Lecture"
        >
            ▶
        </button>


        <button
            class="mini-control"
            id="miniNext"
            aria-label="Suivant"
        >
            ⏭
        </button>


        <div class="mini-progress">

            <div id="miniProgress"></div>

        </div>

    </div>


    <!-- =========================
         GRAND LECTEUR
    ========================== -->

    <div
        class="player-screen"
        id="playerScreen"
    >

        <div class="player-header">

            <button
                id="closePlayer"
                class="back-button"
            >
                ↓
            </button>

            <span>LECTURE</span>

            <button
                id="playerFavorite"
                class="heart-button"
            >
                ♡
            </button>

        </div>


        <div class="big-cover-wrapper">

            <div
                class="big-cover"
                id="bigCover"
            >
                ♪
            </div>

        </div>


        <div class="big-song-info">

            <div>

                <h2 id="bigTitle">
                    Aucun morceau
                </h2>

                <p id="bigArtist">
                    K-Music
                </p>

            </div>

        </div>


        <div class="progress-area">

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="player-controls">

            <button
                id="shuffle"
                class="secondary-control"
                aria-label="Aléatoire"
            >
                🔀
            </button>

            <button
                id="previous"
                class="control-button"
            >
                ⏮
            </button>

            <button
                id="play"
                class="big-play"
            >
                ▶
            </button>

            <button
                id="next"
                class="control-button"
            >
                ⏭
            </button>

            <button
                id="repeat"
                class="secondary-control"
                aria-label="Répéter"
            >
                🔁
            </button>

        </div>

    </div>


    <!-- AUDIO -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


    <!-- METADATA -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <!-- APPLICATION -->

    <script src="app.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js")
            .then(() => {
                console.log("K-Music offline ready");
            })
            .catch(error => {
                console.error(
                    "Service Worker error:",
                    error
                );
            });
    }
</script>

</body>

</html>
